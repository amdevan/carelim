services:
  db:
    image: postgres:16-alpine
    container_name: carelim-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carelim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carelim123}
      POSTGRES_DB: ${POSTGRES_DB:-carelim}
    volumes:
      - carelim-db-data:/var/lib/postgresql/data
    networks:
      - carelim-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carelim}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Main application: clinic CMS + patient/doctor/booking portals.
  # Its /api/* is a thin proxy to the backend service (the real API).
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: carelim-frontend
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-carelim}:${POSTGRES_PASSWORD:-carelim123}@db:5432/${POSTGRES_DB:-carelim}?schema=public}
      - JWT_SECRET=${JWT_SECRET:?Please set JWT_SECRET}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-${JWT_SECRET}}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - INTERNAL_API_URL=http://backend:4000
    networks:
      - carelim-net
    restart: unless-stopped

  # Standalone Express API — the real backend (auth, tenants, doctors,
  # dashboard, ...). All frontend /api/* traffic is proxied here.
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: carelim-backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-carelim}:${POSTGRES_PASSWORD:-carelim123}@db:5432/${POSTGRES_DB:-carelim}?schema=public}
      - JWT_SECRET=${JWT_SECRET:?Please set JWT_SECRET}
    networks:
      - carelim-net
    restart: unless-stopped

  # SaaS super-admin panel (manages all tenants)
  saas:
    build:
      context: .
      dockerfile: apps/saas/Dockerfile
    container_name: carelim-saas
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-carelim}:${POSTGRES_PASSWORD:-carelim123}@db:5432/${POSTGRES_DB:-carelim}?schema=public}
      - JWT_SECRET=${JWT_SECRET:?Please set JWT_SECRET}
    networks:
      - carelim-net
    restart: unless-stopped

  # CRM mini-app
  carelim-ms:
    build:
      context: .
      dockerfile: apps/carelim-ms/Dockerfile
    container_name: carelim-ms
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-carelim}:${POSTGRES_PASSWORD:-carelim123}@db:5432/${POSTGRES_DB:-carelim}?schema=public}
      - JWT_SECRET=${JWT_SECRET:?Please set JWT_SECRET}
    networks:
      - carelim-net
    restart: unless-stopped

  # Marketing / marketplace site
  marketplace:
    build:
      context: .
      dockerfile: apps/marketplace/Dockerfile
    container_name: carelim-marketplace
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-carelim}:${POSTGRES_PASSWORD:-carelim123}@db:5432/${POSTGRES_DB:-carelim}?schema=public}
      - JWT_SECRET=${JWT_SECRET:?Please set JWT_SECRET}
    networks:
      - carelim-net
    restart: unless-stopped

networks:
  carelim-net:

volumes:
  carelim-db-data:
